<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.svg">
    <title>Sudoku Championship - Login</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/modern/main-modern.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Auth page specific styles with modern theme */
        :root {
            --auth-surface: rgba(10, 10, 20, 0.95);
            --auth-glass: rgba(255, 255, 255, 0.03);
            --auth-border: rgba(255, 255, 255, 0.08);
            --auth-accent: #667eea;
            --auth-accent-secondary: #764ba2;
            --auth-cyan: #00f2fe;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: #0a0a14;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .auth-container {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        /* Grid scan background */
        .auth-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(102, 126, 234, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(102, 126, 234, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
        }

        /* Scanning line effect */
        .auth-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(102, 126, 234, 0.12) 0%,
                transparent 15%,
                transparent 85%,
                rgba(102, 126, 234, 0.12) 100%
            );
            background-size: 100% 200%;
            animation: gridScan 4s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridScan {
            0% { background-position: 0% 0%; }
            100% { background-position: 0% 200%; }
        }

        /* Aurora background blobs */
        .auth-aurora {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .auth-aurora::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            top: -200px;
            left: -200px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.15) 0%, transparent 60%);
            animation: auroraFloat 15s ease-in-out infinite;
        }

        .auth-aurora::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            bottom: -150px;
            right: -150px;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.12) 0%, transparent 60%);
            animation: auroraFloat 18s ease-in-out infinite reverse;
        }

        @keyframes auroraFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -20px) scale(1.05); }
            50% { transform: translate(-20px, 30px) scale(0.95); }
            75% { transform: translate(20px, 20px) scale(1.02); }
        }

        .auth-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 3rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                0 0 60px rgba(102, 126, 234, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            max-width: 420px;
            width: 100%;
        }

        /* Top shimmer line */
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            border-radius: 24px 24px 0 0;
        }

        .auth-logo {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--auth-cyan) 0%, var(--auth-accent) 50%, var(--auth-accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(0, 242, 254, 0.3));
        }

        .auth-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.75rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
            background: linear-gradient(90deg, #fff 0%, var(--auth-cyan) 50%, #fff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleShimmer 4s linear infinite;
        }

        @keyframes titleShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .auth-subtitle {
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 2rem;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .auth-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            color: white;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            appearance: none;
            -webkit-appearance: none;
        }

        .auth-input:focus {
            outline: none;
            border-color: var(--auth-accent);
            background: rgba(102, 126, 234, 0.1);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .auth-input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        /* Select dropdown styling */
        .auth-input option {
            background: #1a1a2e;
            color: white;
            padding: 0.75rem;
        }

        .auth-button {
            position: relative;
            background: linear-gradient(135deg, var(--auth-accent) 0%, var(--auth-accent-secondary) 100%);
            border: none;
            border-radius: 12px;
            padding: 1rem 2rem;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            overflow: hidden;
        }

        .auth-button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .auth-button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow:
                0 10px 30px rgba(102, 126, 234, 0.4),
                0 0 40px rgba(102, 126, 234, 0.2);
        }

        .auth-button:hover::before {
            opacity: 1;
        }

        .auth-button:active {
            transform: translateY(-1px) scale(0.99);
        }

        .auth-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .auth-error {
            color: #f472b6;
            margin-top: 1rem;
            display: none;
            padding: 0.75rem 1rem;
            background: rgba(244, 114, 182, 0.1);
            border: 1px solid rgba(244, 114, 182, 0.2);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        /* Mobile optimizations */
        @media (max-width: 480px) {
            .auth-card {
                padding: 2rem 1.5rem;
                border-radius: 20px;
            }

            .auth-title {
                font-size: 1.5rem;
            }

            .auth-logo {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-aurora"></div>
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fas fa-trophy"></i>
            </div>
            <h1 class="auth-title">Championship Arena</h1>
            <p class="auth-subtitle">Choose your champion</p>

            <form class="auth-form" id="authForm">
                <select class="auth-input" id="playerSelect" required>
                    <option value="">Select Player</option>
                    <option value="faidao">Faidao - The Queen</option>
                    <option value="filip">Filip - The Champion</option>
                </select>
                <input
                    type="password"
                    class="auth-input"
                    id="passwordInput"
                    placeholder="Enter password"
                    required
                    autocomplete="current-password"
                >
                <button type="submit" class="auth-button">
                    <i class="fas fa-gamepad"></i> Enter Battle Arena
                </button>
            </form>

            <div class="auth-error" id="authError">
                <i class="fas fa-exclamation-triangle"></i> Invalid credentials. Try again.
            </div>

        </div>
    </div>

    <script>
        // Secure API-based authentication
        document.getElementById('authForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const player = document.getElementById('playerSelect').value;
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('authError');
            const submitButton = document.querySelector('.auth-button');

            // Disable submit button during authentication
            submitButton.disabled = true;
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

            try {
                // Call authentication API
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username: player, password })
                });

                const result = await response.json();

                if (result.success) {
                    // Store authentication and player identity in session
                    sessionStorage.setItem('sudokuAuth', 'authenticated');
                    sessionStorage.setItem('currentPlayer', result.player);
                    sessionStorage.setItem('displayName', result.displayName);
                    if (result.avatar) {
                        sessionStorage.setItem('avatar', result.avatar);
                    }
                    // Redirect to main app
                    window.location.href = 'index.html';
                } else {
                    // Show error
                    errorDiv.style.display = 'block';
                    document.getElementById('passwordInput').value = '';
                    document.getElementById('passwordInput').focus();
                    submitButton.disabled = false;
                    submitButton.innerHTML = '<i class="fas fa-gamepad"></i> Enter Battle Arena';
                }
            } catch (error) {
                console.error('Authentication error:', error);
                errorDiv.textContent = 'Authentication failed. Please try again.';
                errorDiv.style.display = 'block';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
                submitButton.disabled = false;
                submitButton.innerHTML = '<i class="fas fa-gamepad"></i> Enter Battle Arena';
            }
        });

        // Check if already authenticated
        if (sessionStorage.getItem('sudokuAuth') === 'authenticated') {
            window.location.href = 'index.html';
        }

        // 🚀 PERFORMANCE OPTIMIZATION: Enhanced comprehensive data preloading
        // This system loads all critical data while user is on login page for instant game access
        // - Preloads puzzles, scores, achievements, and progress data in parallel
        // - Stores data in sessionStorage for instant retrieval on main app
        // - Reduces localStorage dependency and improves loading times
        async function preloadDataInBackground() {
            try {
                console.log('🚀 Starting comprehensive background preload...');
                const preloadStart = performance.now();

                // Get today's date for date-specific data
                const today = new Date().toISOString().split('T')[0];

                // Preload all critical data in parallel for maximum performance
                const dataPromises = [
                    // Core game data
                    fetch('/api/entries').then(response => response.ok ? response.json() : []),
                    fetch('/api/stats?type=all').then(response => response.ok ? response.json() : {}),

                    // Today's puzzles with cache busting
                    fetch(`/api/puzzles?date=${today}&t=${Date.now()}`).then(response => response.ok ? response.json() : null),

                    // Today's game progress
                    fetch(`/api/games2?date=${today}`).then(response => response.ok ? response.json() : {}),

                    // Achievement data for instant page loads
                    fetch('/api/achievements').then(response => response.ok ? response.json() : []),

                    // Challenge data
                    fetch('/api/stats?type=challenges').then(response => response.ok ? response.json() : [])
                ];

                const [entries, bulkData, puzzles, todayGames, achievements, challenges] = await Promise.all(dataPromises);

                // Store all preloaded data efficiently
                const preloadedData = {
                    entries: entries || [],
                    bulkData: bulkData || {},
                    puzzles: puzzles,
                    todayGames: todayGames || {},
                    achievements: achievements || [],
                    challenges: challenges || [],
                    loadTime: Date.now(),
                    date: today
                };

                // Store as single compressed object to reduce sessionStorage operations
                sessionStorage.setItem('comprehensivePreload', JSON.stringify(preloadedData));

                // Backwards compatibility with existing code
                sessionStorage.setItem('preloadedEntries', JSON.stringify(entries || []));
                sessionStorage.setItem('preloadedBulkData', JSON.stringify(bulkData || {}));
                if (puzzles) {
                    sessionStorage.setItem('preloadedPuzzles', JSON.stringify(puzzles));
                    sessionStorage.setItem('puzzlesLoadTime', Date.now().toString());
                }

                const preloadEnd = performance.now();
                console.log(`✅ Comprehensive preload completed in ${(preloadEnd - preloadStart).toFixed(1)}ms`);
                console.log('📊 Preloaded data:', {
                    entries: (entries || []).length,
                    puzzles: puzzles ? Object.keys(puzzles).length : 0,
                    todayGames: Object.keys(todayGames || {}).length,
                    achievements: (achievements || []).length,
                    challenges: (challenges || []).length
                });

            } catch (error) {
                console.warn('Background preload error:', error);
                // Fallback: try to preload at least the essentials
                try {
                    const today = new Date().toISOString().split('T')[0];
                    const essentials = await Promise.allSettled([
                        fetch('/api/entries').then(r => r.json()),
                        fetch(`/api/puzzles?date=${today}&t=${Date.now()}`).then(r => r.json())
                    ]);

                    if (essentials[0].status === 'fulfilled') {
                        sessionStorage.setItem('preloadedEntries', JSON.stringify(essentials[0].value));
                    }
                    if (essentials[1].status === 'fulfilled') {
                        sessionStorage.setItem('preloadedPuzzles', JSON.stringify(essentials[1].value));
                        sessionStorage.setItem('puzzlesLoadTime', Date.now().toString());
                    }
                    console.log('🔄 Fallback preload completed');
                } catch (fallbackError) {
                    console.warn('Fallback preload also failed:', fallbackError);
                }
            }
        }

        // Start preloading immediately when page loads
        preloadDataInBackground();

        // Add logout functionality for testing
        window.logout = function() {
            sessionStorage.removeItem('sudokuAuth');
            sessionStorage.removeItem('currentPlayer');
            // Clear preloaded data on logout
            sessionStorage.removeItem('preloadedEntries');
            sessionStorage.removeItem('preloadedBulkData');
            sessionStorage.removeItem('preloadedPuzzles');
            sessionStorage.removeItem('puzzlesLoadTime');
            window.location.href = 'auth.html';
        };
    </script>
    <script src="js/themes.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
