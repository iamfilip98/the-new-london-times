<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="#0a0a14"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#g)" stroke-width="8" opacity="0.3"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#g)" stroke-width="4" opacity="0.5"/>
  <!-- 3x3 Sudoku grid hint -->
  <g stroke="url(#g)" stroke-width="3" fill="none" opacity="0.8">
    <rect x="156" y="156" width="200" height="200" rx="8"/>
    <line x1="222" y1="156" x2="222" y2="356"/>
    <line x1="289" y1="156" x2="289" y2="356"/>
    <line x1="156" y1="222" x2="356" y2="222"/>
    <line x1="156" y1="289" x2="356" y2="289"/>
  </g>
  <!-- Sample numbers -->
  <g fill="url(#g)" font-family="Inter, sans-serif" font-size="36" font-weight="600" text-anchor="middle">
    <text x="189" y="205">9</text>
    <text x="322" y="272">5</text>
    <text x="256" y="338">7</text>
  </g>
</svg>
